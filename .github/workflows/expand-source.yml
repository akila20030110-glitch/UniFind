name: Expand UniFind Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expand-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Expand source package
        shell: bash
        run: |
          set -e
          rm -rf .tmp-unifind
          mkdir .tmp-unifind
          unzip -q UniFind_Source_Complete.zip -d .tmp-unifind
          SRC_DIR="$(find .tmp-unifind -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "$SRC_DIR" ]; then
            echo "No source directory found in ZIP."
            exit 1
          fi
          cp -a "$SRC_DIR"/. .
          rm -rf .tmp-unifind
          rm -f UniFind_Source_Complete.zip

      - name: Commit expanded project files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Expand UniFind project source"
          git push
